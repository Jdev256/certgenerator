[alembic]
# Caminho para a pasta de migrações
script_location = migrations

# Formato do nome do arquivo de migração (data + slug)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone usada nos timestamps das migrações
timezone = America/Sao_Paulo

# A URL do banco é definida dinamicamente em migrations/env.py
# a partir da mesma variável de ambiente DATABASE_URL usada em app/db.py.
# Não é necessário (nem recomendado) colocar a URL/senha aqui.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S